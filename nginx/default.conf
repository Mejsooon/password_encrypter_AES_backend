# Limit zapytań: max 10 na sekundę z jednego adresu IP (ochrona przed spamem)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name _;

    # Nie pokazuj wersji nginx w odpowiedziach i stronach błędów
    server_tokens off;

    # Maksymalny rozmiar zapytania (hasło ma max 1024 znaki, więc 16 KB wystarczy)
    client_max_body_size 16k;

    # ---------- Nagłówki bezpieczeństwa ----------
    # Przeglądarka nie zgaduje typu pliku
    add_header X-Content-Type-Options "nosniff" always;
    # Strony nie można osadzić w <iframe> na innej stronie (ochrona przed clickjackingiem)
    add_header X-Frame-Options "DENY" always;
    # Nie wysyłaj pełnego adresu strony do innych witryn
    add_header Referrer-Policy "no-referrer" always;
    # CSP: skąd przeglądarka może ładować skrypty, style, fonty i z kim może się łączyć
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ---------- API: wszystko pod /api/ idzie do backendu ----------
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        # Po przekroczeniu limitu zwróć 429 "Too Many Requests" (domyślnie byłoby 503)
        limit_req_status 429;

        # "backend" to nazwa usługi z docker-compose.yml
        proxy_pass http://backend:8000;

        # Przekazujemy backendowi informacje o prawdziwym użytkowniku
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Frontend: pliki z folderu frontend/ ----------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Jeśli pliku nie ma, zwróć 404
        try_files $uri $uri/ =404;
    }
}